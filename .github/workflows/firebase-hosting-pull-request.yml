name: Deploy PR previews to Firebase Hosting

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: meal-planner-app/package-lock.json

      - name: Generate build metadata
        working-directory: meal-planner-app
        run: |
          node -e "const fs = require('fs'); const buildNumber = process.env.BUILD_NUMBER || 'local'; const sha = (process.env.BUILD_SHA || 'local').slice(0, 7); const generatedAt = new Date().toISOString(); const file = 'src/app/build-info.ts'; const content = 'export const buildInfo = {\n  buildNumber: ' + JSON.stringify(String(buildNumber)) + ',\n  sha: ' + JSON.stringify(String(sha)) + ',\n  generatedAt: ' + JSON.stringify(generatedAt) + ',\n};\n'; fs.writeFileSync(file, content); console.log('Build metadata: ' + buildNumber + ' / ' + sha + ' / ' + generatedAt);"

      - name: Install dependencies
        working-directory: meal-planner-app
        run: npm ci

      - name: Build the app
        working-directory: meal-planner-app
        run: npm run build

      - name: Print deploy metadata
        run: |
          echo "Preview build number: $BUILD_NUMBER"
          echo "Commit SHA: $BUILD_SHA"

      - name: Deploy preview to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEAL_PLANNER_APP }}
          projectId: mealplannerapp-prod-2026
          entryPoint: ./meal-planner-app
