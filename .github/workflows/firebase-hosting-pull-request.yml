name: Deploy PR previews to Firebase Hosting

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: meal-planner-app/package-lock.json

      - name: Install dependencies
        working-directory: meal-planner-app
        run: npm ci

      - name: Build the app
        working-directory: meal-planner-app
        run: npm run build

      - name: Deploy preview to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEAL_PLANNER_APP }}
          projectId: meal-planner-app
          entryPoint: ./meal-planner-app
