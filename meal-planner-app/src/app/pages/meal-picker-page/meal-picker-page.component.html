<div class="page-shell">
  <nav class="breadcrumbs" aria-label="Breadcrumb">
    <a routerLink="/plan-next-week">Plan Next Week</a>
    <span aria-hidden="true">/</span>
    <span aria-current="page">Choose for {{ dayLabel }}</span>
  </nav>

  <header class="topbar">
    <div>
      <p class="eyebrow">Plan Next Week</p>
      <h1>Choose a meal for {{ dayLabel }}</h1>
    </div>
  </header>

  <section class="meal-list" *ngIf="mealPlanner.meals.length; else noMeals">
    <article class="meal-item" *ngFor="let meal of mealPlanner.meals">
      <a
        class="meal-summary"
        [routerLink]="['/meals', meal.id]"
        [queryParams]="{ dayIndex: dayIndex, from: 'meal-picker' }"
      >
        <span class="meal-type">{{ meal.category }} · {{ mealPlanner.getMealTypeLabel(meal.mealType) }}</span>
        <span class="meal-name-row">
          <strong>{{ meal.customTitle || meal.name }}</strong>
          <span
            *ngIf="meal.vegetarian === true"
            class="vegetarian-mark"
            role="img"
            aria-label="Vegetarian"
            title="Vegetarian"
          >V</span>
        </span>
        <span
          class="rating-badge"
          [attr.aria-label]="'Rating ' + meal.starRating + ' out of 10'"
        >
          <span>{{ meal.starRating }}</span>
          <span class="rating-star" aria-hidden="true">★</span>
        </span>
      </a>
      <button class="choose-button" type="button" (click)="selectMeal(meal.id)">
        Choose for {{ dayLabel }}
      </button>
    </article>
  </section>
</div>

<ng-template #noMeals>
  <p class="empty-state">No saved meals yet. Add meals from the Meal Library first.</p>
</ng-template>
