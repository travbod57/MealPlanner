<div class="app-shell">
  <header class="app-header">
    <div class="brand">Meal Planner</div>
    <div class="header-controls">
      <nav class="top-nav" aria-label="Main navigation">
        <a routerLink="/this-week" routerLinkActive="active">This Week</a>
        <a routerLink="/plan-next-week" routerLinkActive="active">Plan Next Week</a>
        <a routerLink="/meals" routerLinkActive="active">Meal Library</a>
      </nav>
      <a class="settings-link" routerLink="/settings" routerLinkActive="active" aria-label="Settings" title="Settings">
        <mat-icon>settings</mat-icon>
      </a>
    </div>
  </header>

  <main class="content-shell">
    <section *ngIf="mealPlanner.loadError as loadError" class="data-status error" role="alert">
      <h1>Saved data unavailable</h1>
      <p>{{ loadError }}</p>
    </section>
    <section *ngIf="!mealPlanner.isReady && !mealPlanner.loadError" class="data-status" role="status">
      <p>Loading saved meals and plans…</p>
    </section>
    <section *ngIf="mealPlanner.saveError as saveError" class="data-status error" role="alert">
      <p>{{ saveError }}</p>
    </section>
    <router-outlet *ngIf="mealPlanner.isReady"></router-outlet>
  </main>

  <div class="build-badge" aria-label="Build information">
    Build #{{ buildInfo.buildNumber }} · {{ buildInfo.sha }} · {{ buildInfo.generatedAt | date: 'yyyy-MM-dd HH:mm' }}
  </div>
</div>
